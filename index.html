<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PocketMountz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;700;800&family=Inter:wght@400;500&display=swap">

<style>
:root {
  --bg:   #0A0A0A;
  --gold: #C8A44A;
  --text: #C0C0C0;
  --white: #F2F2F2;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-left:  max(24px, env(safe-area-inset-left,  0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-block: max(48px, env(safe-area-inset-top, 0px)) max(48px, env(safe-area-inset-bottom, 0px));
  text-align: center;
  -webkit-font-smoothing: antialiased;
}

.logo {
  width: min(480px, 90vw);
  margin-bottom: 48px;
}

.tagline {
  font-family: 'Oswald', sans-serif;
  font-weight: 300;
  font-size: clamp(1.1rem, 3.5vw, 1.6rem);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 20px;
}

.body {
  font-size: clamp(0.95rem, 2vw, 1.1rem);
  line-height: 1.8;
  color: var(--text);
  max-width: 540px;
}

.body strong {
  color: var(--white);
  font-weight: 500;
}

.rule {
  width: 60px;
  height: 1px;
  background: var(--gold);
  margin: 36px auto;
  opacity: 0.6;
}

.coming {
  font-family: 'Oswald', sans-serif;
  font-weight: 300;
  font-size: 0.75rem;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--gold);
  opacity: 0.7;
  margin-bottom: 20px;
}

.optin {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  max-width: 380px;
  width: 100%;
}

.optin input {
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 4px;
  color: var(--white);
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  padding: 9px 14px;
  flex: 1 1 180px;
  outline: none;
}
.optin input::placeholder { color: #555; }
.optin input:focus { border-color: var(--gold); }

.optin button {
  background: var(--gold);
  border: none;
  border-radius: 4px;
  color: #000;
  cursor: pointer;
  font-family: 'Oswald', sans-serif;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: .1em;
  padding: 9px 18px;
  text-transform: uppercase;
  white-space: nowrap;
}
.optin button:hover { opacity: 0.85; }

.thanks {
  font-size: 0.8rem;
  color: var(--gold);
  margin-top: 12px;
  letter-spacing: .05em;
}

/* fade in top to bottom */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.logo       { animation: fadeUp 1.6s ease both; animation-delay: .3s; }
.coming     { animation: fadeUp 1.4s ease both; animation-delay: 1.0s; }
.tagline    { animation: fadeUp 1.4s ease both; animation-delay: 1.5s; }
.rule:nth-of-type(1) { animation: fadeUp 1.4s ease both; animation-delay: 1.9s; }
.body       { animation: fadeUp 1.4s ease both; animation-delay: 2.3s; }
.rule:nth-of-type(2) { animation: fadeUp 1.4s ease both; animation-delay: 2.7s; }
.optin      { animation: fadeUp 1.4s ease both; animation-delay: 3.5s; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
</style>
</head>
